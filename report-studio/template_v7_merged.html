<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBK 상품 보고서 생성기</title>
<style>
  :root {
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --line2:#f0f2f5; --bg:#f3f5f9; --card:#fff; --soft:#f8fafc;
    --brand:#1d4f9c; --brand-soft:#eaf1fb;
    --edu:#5a48b0; --edu-soft:#f1eefb; --guide:#0f7b72; --guide-soft:#e7f5f3; --teller:#1d4f9c; --teller-soft:#eaf1fb;
    --accent:#1d4f9c; --accent-soft:#eaf1fb;
    --ok:#15803d; --ok-soft:#ecf8f0; --warn:#b45309; --warn-soft:#fff6e8; --bad:#b91c1c; --bad-soft:#fdf0f0;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; font-size:15.5px; word-break:keep-all; }
  button, input, select, textarea { font:inherit; color:inherit; }
  a { color:var(--brand); }

  .topbar { background:var(--brand); color:#fff; padding:16px 24px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; }
  .topbar h1 { margin:0; font-size:20px; }
  .topbar .sub { font-size:14px; opacity:.85; }
  .topbar .date { margin-left:auto; background:rgba(255,255,255,.16); border-radius:999px; padding:4px 14px; font-size:13px; }

  .layout { display:grid; grid-template-columns:300px 1fr; gap:20px; padding:20px; max-width:1360px; margin:0 auto; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; padding:12px; } }

  aside { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; align-self:start; position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:auto; }
  @media (max-width:900px) { aside { position:static; max-height:none; } }
  aside h2 { font-size:15px; margin:0 0 10px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 13px; cursor:pointer; font-size:13.5px; }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .plist { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .pitem { border:1px solid var(--line); border-radius:12px; padding:11px 12px; cursor:pointer; background:var(--card); text-align:left; width:100%; display:block; }
  .pitem:hover { border-color:#b8c7e0; }
  .pitem.on { border-color:var(--brand); background:var(--brand-soft); }
  .pitem .cat { font-size:11.5px; color:var(--brand); background:var(--brand-soft); border-radius:4px; padding:1px 6px; margin-right:6px; }
  .pitem.on .cat { background:#fff; }
  .pitem .nm { font-weight:bold; font-size:14.5px; }
  .pitem .ol { font-size:12.5px; color:var(--muted); display:block; margin-top:3px; line-height:1.5; }
  .pitem .kv { font-size:13px; color:var(--brand); font-weight:bold; display:block; margin-top:3px; }

  .toolbar { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:700px) { .tabs { grid-template-columns:1fr; } }
  .tab { border:2px solid var(--line); background:var(--card); border-radius:14px; padding:12px 16px; cursor:pointer; text-align:left; }
  .tab b { display:block; font-size:16px; }
  .tab span { font-size:13px; color:var(--muted); }
  .tab[data-k=edu].on { border-color:var(--edu); background:var(--edu-soft); } .tab[data-k=edu].on b { color:var(--edu); }
  .tab[data-k=guide].on { border-color:var(--guide); background:var(--guide-soft); } .tab[data-k=guide].on b { color:var(--guide); }
  .tab[data-k=teller].on { border-color:var(--teller); background:var(--teller-soft); } .tab[data-k=teller].on b { color:var(--teller); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .btn { border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:8px; padding:7px 16px; cursor:pointer; font-size:14px; }
  .btn.ghost { background:var(--card); color:var(--brand); }

  .report { display:none; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 40px; }
  .report.active { display:block; }
  @media (max-width:700px) { .report { padding:18px 16px; } }
  #rep-edu { --accent:var(--edu); --accent-soft:var(--edu-soft); }
  #rep-guide { --accent:var(--guide); --accent-soft:var(--guide-soft); }
  #rep-teller { --accent:var(--teller); --accent-soft:var(--teller-soft); }
  .rhead { padding-bottom:16px; margin-bottom:20px; border-bottom:3px solid var(--accent); }
  .rhead .kind { display:inline-block; background:var(--accent); color:#fff; border-radius:6px; padding:3px 12px; font-size:13.5px; font-weight:bold; }
  .rhead h2 { margin:10px 0 4px; font-size:27px; line-height:1.35; }
  .rhead .meta { font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 16px; }
  .rhead .meta b { color:var(--ink); font-weight:normal; }
  .report h3 { font-size:19px; margin:36px 0 12px; display:flex; align-items:center; gap:10px; }
  .report h3::before { content:""; width:5px; height:20px; border-radius:3px; background:var(--accent); }
  .report h4 { font-size:15.5px; margin:16px 0 6px; color:var(--accent); }
  .lead { font-size:17px; background:var(--accent-soft); border-radius:12px; padding:14px 18px; line-height:1.65; }

  table { border-collapse:separate; border-spacing:0; width:100%; font-size:15px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { border-bottom:1px solid var(--line); padding:11px 14px; text-align:left; vertical-align:top; }
  tr:last-child th, tr:last-child td { border-bottom:0; }
  th { background:var(--soft); white-space:nowrap; color:#374151; font-weight:bold; width:1%; }
  td + th { border-left:1px solid var(--line); }
  .tbl-wrap { overflow-x:auto; }
  tr.me td { background:var(--accent-soft); font-weight:bold; }
  table.cmp th { width:auto; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-radius:14px; padding:14px 18px; background:var(--soft); }
  .tile .l { font-size:13.5px; color:var(--muted); }
  .tile .v { font-size:23px; font-weight:bold; color:var(--accent); line-height:1.35; margin:2px 0; }
  .tile .s { font-size:12.5px; color:var(--muted); }

  .badge { display:inline-block; border-radius:999px; padding:2px 11px; font-size:13px; font-weight:bold; vertical-align:2px; }
  .b-ok { background:var(--ok-soft); color:var(--ok); } .b-warn { background:var(--warn-soft); color:var(--warn); } .b-bad { background:var(--bad-soft); color:var(--bad); }
  .box { border-radius:12px; padding:14px 18px; margin:10px 0; }
  .box b:first-child { display:block; margin-bottom:4px; }
  .box.warn { background:var(--warn-soft); border:1px solid #f6d7a6; }
  .box.bad { background:var(--bad-soft); border:1px solid #f5c2c2; }
  .box.ok { background:var(--ok-soft); border:1px solid #b9e2c6; }
  .box.info { background:var(--soft); border:1px solid var(--line); }
  ul.clean { margin:6px 0; padding-left:20px; } ul.clean li { margin:5px 0; }
  ul.clean li::marker { color:var(--accent); }
  .checks { list-style:none; padding:0; margin:8px 0; } .checks li { padding:10px 2px; border-bottom:1px solid var(--line2); display:flex; gap:12px; align-items:flex-start; }
  .ic { flex:0 0 auto; min-width:52px; text-align:center; font-size:12.5px; font-weight:bold; border-radius:999px; padding:1px 8px; margin-top:2px; }
  .ic-ok { color:var(--ok); background:var(--ok-soft); } .ic-warn { color:var(--warn); background:var(--warn-soft); } .ic-bad { color:var(--bad); background:var(--bad-soft); } .ic-info { color:var(--brand); background:var(--brand-soft); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; } @media (max-width:700px){ .grid2 { grid-template-columns:1fr; } }
  .muted { color:var(--muted); } .small { font-size:13px; }

  .flash { border:1px solid var(--line); border-radius:12px; margin:8px 0; overflow:hidden; }
  .flash summary { cursor:pointer; padding:12px 16px; background:var(--soft); font-weight:bold; }
  .flash summary::marker { color:var(--accent); }
  .flash div { padding:12px 16px; } .flash div::before { content:"정답 "; font-weight:bold; color:var(--ok); }

  .script { border:1px solid var(--line); border-radius:12px; margin:12px 0; overflow:hidden; }
  .script .step { font-size:14.5px; font-weight:bold; color:var(--accent); background:var(--accent-soft); padding:8px 16px; }
  .script > p, .script > ul { margin:8px 16px; }
  .say { background:var(--soft); border-radius:10px; padding:10px 14px; margin:6px 0; }
  .say::before { content:"화법"; display:inline-block; font-size:11.5px; font-weight:bold; color:#fff; background:var(--accent); border-radius:4px; padding:0 6px; margin-right:8px; vertical-align:1px; }

  .calc { border:1px solid var(--line); border-radius:14px; padding:16px 18px; background:var(--soft); }
  .calc label { display:inline-flex; flex-direction:column; font-size:13px; color:var(--muted); margin:0 14px 10px 0; }
  .calc input, .calc select, .form input, .form select, .form textarea { border:1px solid #d1d5db; border-radius:8px; padding:7px 10px; background:#fff; min-width:130px; }
  .calc .res { font-size:15.5px; margin-top:6px; }
  .calc .big { font-size:26px; font-weight:bold; color:var(--accent); }

  .form { background:var(--teller-soft); border:1px solid #cddcf2; border-radius:16px; padding:18px 20px; margin-bottom:18px; }
  .form h3 { margin:16px 0 10px; font-size:16px; } .form h3:first-child { margin-top:0; }
  .form h3::before { content:none; }
  .form .row { display:flex; flex-wrap:wrap; gap:10px 14px; }
  .form label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); }
  .form .needs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 8px; }
  .form .needs label { flex-direction:row; align-items:center; gap:5px; background:#fff; border:1px solid #d1d5db; border-radius:999px; padding:4px 12px; color:var(--ink); font-size:13.5px; cursor:pointer; }
  .form .flags { display:flex; flex-wrap:wrap; gap:6px 18px; }
  .form .flags label { flex-direction:row; gap:6px; color:var(--ink); font-size:14px; align-items:center; cursor:pointer; }
  .form input[type=checkbox], .principles input[type=checkbox] { min-width:0; width:auto; margin:0; }
  .presets { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; }
  .preset { border:1px solid #cddcf2; background:#fff; border-radius:12px; padding:10px 12px; cursor:pointer; text-align:left; }
  .preset:hover { border-color:var(--teller); }
  .blogo { height:26px; display:block; margin-bottom:10px; }
  .gphoto { margin:20px 0 0; } .gphoto .gimg { width:100%; height:200px; object-fit:cover; border-radius:14px; display:block; }
  .banner { display:flex; align-items:center; gap:20px; background:var(--accent-soft); border-radius:16px; padding:22px 26px; margin-bottom:24px; }
  .banner .rhead { flex:1; border:0; margin:0; padding:0; }
  .banner .illu { flex:0 0 220px; width:220px; height:auto; }
  @media (max-width:700px) { .banner { flex-direction:column-reverse; align-items:flex-start; } .banner .illu { width:160px; flex-basis:auto; } }
  .preset { display:flex; gap:10px; align-items:center; }
  .preset .thumb { width:54px; height:54px; object-fit:cover; border-radius:10px; flex:0 0 54px; }
  .preset .pt { display:block; }
  .preset b { display:block; font-size:14.5px; } .preset span { font-size:12.5px; color:var(--muted); }
  .preset.on { border:2px solid var(--teller); padding:9px 11px; } .preset.on b { color:var(--teller); }
  .rank { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:8px; }
  .rank li { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .rank .no { font-weight:bold; color:#fff; background:var(--teller); border-radius:50%; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; font-size:14px; }
  .rank .why { font-size:13px; color:var(--muted); flex:1 1 260px; }
  .rank li.me { border-color:var(--teller); }
  .rank .btn { padding:3px 10px; font-size:13px; }

  .recs { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  .rec { border:1px solid var(--line); border-radius:14px; padding:14px 16px; background:var(--soft); }
  .rec b { display:block; font-size:15.5px; } .rec .why { font-size:13.5px; margin-top:6px; }
  .rec button { margin-top:8px; font-size:13px; padding:4px 12px; }

  .principles { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:8px; }
  .principles label { display:flex; gap:10px; align-items:flex-start; font-size:14.5px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; }
  textarea.memo { width:100%; min-height:90px; border:1px solid #d1d5db; border-radius:10px; padding:10px; }
  .memo-print { display:none; white-space:pre-wrap; border:1px solid var(--line); border-radius:10px; padding:10px; min-height:60px; }

  svg text { font-family:inherit; }
  svg.i { width:1.05em; height:1.05em; vertical-align:-0.15em; flex:0 0 auto; }
  svg.i.bi { margin-right:7px; color:var(--accent); }
  svg.i.ci { margin-right:3px; }
  .tab b svg.i, .btn svg.i, .rhead .kind svg.i { margin-right:6px; }
  .btn svg.i:last-child:not(:first-child) { margin:0 0 0 4px; }
  .topbar h1 { display:flex; align-items:center; gap:12px; }
  .topbar .logo { height:26px; display:block; }
  .topbar h1 .sep { width:1px; height:18px; background:rgba(255,255,255,.4); }
  .ic { display:inline-flex; align-items:center; justify-content:center; gap:4px; }
  .box > b svg.i { vertical-align:-0.2em; }
  .switch { border:2px solid var(--teller); background:#fff; border-radius:14px; padding:16px 18px; margin-bottom:16px; }
  .switch .sw-head { display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; } .switch .sw-head svg.i { color:var(--teller); margin-top:4px; }
  .switch .sw-head b { white-space:nowrap; }
  .switch table { margin-bottom:12px; } .switch td .ic { min-width:0; }
  .principles label { align-items:center; background:#fff; }
  .principles label:has(input:checked) { border-color:var(--ok); background:var(--ok-soft); }
  .principles input[type=checkbox] { width:24px; height:24px; min-width:24px; margin:0; accent-color:var(--ok); cursor:pointer; flex:0 0 24px; }
  .chart { width:100%; height:auto; display:block; margin:8px 0; }
  .legend { font-size:13.5px; color:var(--muted); display:flex; gap:18px; flex-wrap:wrap; margin-top:4px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:5px; }

  .src { font-size:13px; color:var(--muted); border-top:1px solid var(--line); margin-top:36px; padding-top:14px; }
  .disclaimer { font-size:12.5px; color:var(--muted); margin-top:6px; }

  @media print {
    @page { size:A4; margin:14mm; }
    body { background:#fff; font-size:12.5px; }
    .topbar, aside, .toolbar, .no-print { display:none !important; }
    .banner .illu { width:150px; flex-basis:150px; }
    .layout { display:block; padding:0; max-width:none; }
    .report { border:0; padding:0; }
    body.print-all .report { display:block; page-break-after:always; }
    .memo-print { display:block; }
    details.flash > div { display:block; }
    a { color:inherit; text-decoration:none; }
    .tile, .box, .rec, .flash, table, .script, svg { break-inside:avoid; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1><img class="logo" src="__LOGO_WHITE__" alt="IBK기업은행"><span class="sep"></span>상품 보고서 생성기</h1>
  <span class="sub">상품을 고르면 직원 교육용 · 고객 안내용 · 창구 영업용 보고서가 자동으로 만들어집니다</span>
  <span class="date" id="checked"></span>
</div>

<div class="layout">
  <aside>
    <h2>상품 고르기</h2>
    <div class="filters" id="filters"></div>
    <ul class="plist" id="plist"></ul>
  </aside>

  <main>
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab on" data-k="edu"><b><span data-icon="edu"></span>직원 교육용</b><span>상품 구조 · 비교 · 퀴즈 · 롤플레이</span></button>
        <button class="tab" data-k="guide"><b><span data-icon="guide"></span>고객 안내용</b><span>쉬운 설명 · 이자/혜택 계산 · 주의사항</span></button>
        <button class="tab" data-k="teller"><b><span data-icon="teller"></span>창구 영업용</b><span>고객 유형 · 적합성 · 화법 · 교차판매</span></button>
      </div>
      <div class="actions">
        <button class="btn" id="print-one"><span data-icon="printer"></span>이 보고서 PDF 저장</button>
        <button class="btn ghost" id="print-all"><span data-icon="files"></span>3종 한 번에 PDF</button>
      </div>
    </div>
    <article class="report active" id="rep-edu"></article>
    <article class="report" id="rep-guide"></article>
    <article class="report" id="rep-teller"></article>
  </main>
</div>

<script>
const CATALOG =
/*__DATA__*/
;

/* ---------------------------------------------------------------
   계산·판단 규칙. 숫자는 모두 products.json(공식 홈페이지 2026-11-06 확인)에서
   옮긴 것이고, 여기서 새로 만든 금리·혜택은 없다. 단위: 금액 '만원', 기간 '개월'.
---------------------------------------------------------------- */
const R = {
  'DEP-01': { kind:'save', monthly:[1,20], terms:{3:2.70, 6:2.90, 12:3.10}, termNames:{3:"1~6개월 미만", 6:"6~12개월 미만", 12:"12개월"}, max:4.6, prot:'yes', remoteOnly:true,
    termS:'1~12개월', amtS:'월 1만~20만원', tags:['매달 모으기','이벤트 자금'],
    fit:['결혼·이사·여행처럼 돈 쓸 날짜가 정해져 있고 1년 안에 모으려는 분','월 20만원 이내로 부담 없이 시작하려는 분','IBK와 처음 거래하는 분(최초 거래 우대 0.5%p)'],
    persona:'29세 직장인. 내년 6월 결혼식 비용 일부를 월 15만원씩 모으고 싶어 함. IBK와는 처음 거래.' },
  'DEP-02': { kind:'save', monthly:[1,200], terms:{12:2.75, 24:2.90, 36:2.90}, max:3.3, prot:'yes',
    termS:'1·2·3년', amtS:'월 1만~200만원', tags:['매달 모으기','주거래'], mainBank:true,
    fit:['급여이체·관리비 자동이체 등으로 IBK를 주거래로 쓰는 분(주거래 우대 0.3%p)','1~3년 꾸준히 모으려는 분','결혼·취업·출산 등으로 중간에 해지할 수도 있는 분(특별중도해지금리)'],
    persona:'35세 중소기업 직원. IBK로 급여를 받고 있고 월 50만원씩 2년 모으려 함.' },
  'DEP-03': { kind:'lump', lump:[100,10000], terms:{12:3.80, 24:3.80, 36:3.80}, base:{12:2.45, 24:2.30, 36:2.25}, max:4.0, prot:'no',
    termS:'1·2·3년', amtS:'100만~1억원', tags:['목돈 예치','주거래'], mainBank:true, compound:true,

/* ---------- SVG 차트 ---------- */
function barChart(rows, opts = {}) {
  // rows: [{label, value, color, note}]
  const W = 760, rowH = 42, left = opts.left || 220, top = 8, right = 130;
  const H = top + rows.length * rowH + 26;
  const max = opts.max || Math.max(...rows.map(r => r.value)) * 1.1 || 1;
  const sx = v => (W - left - right) * v / max;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || '')}">`;
  for (let g = 0; g <= 4; g++) {
    const x = left + (W - left - right) * g / 4;
    s += `<line x1="${x}" y1="${top}" x2="${x}" y2="${H-22}" stroke="#e3e7ed"/>
          <text x="${x}" y="${H-6}" font-size="12" fill="#5f6b7a" text-anchor="middle">${opts.fmt ? opts.fmt(max*g/4) : (max*g/4).toFixed(1)}</text>`;
  }
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    s += `<text x="${left-10}" y="${y+26}" font-size="14" text-anchor="end" fill="#222833" ${r.bold ? 'font-weight="bold"' : ''}>${esc(r.label)}</text>
          <rect x="${left}" y="${y+8}" width="${Math.max(2, sx(r.value))}" height="${rowH-16}" fill="${r.color}"/>
          <text x="${left + sx(r.value) + 8}" y="${y+26}" font-size="14" font-weight="bold" fill="#222833">${esc(r.text ?? r.value)}</text>`;
  });
  return s + '</svg>';
}
// 기간별 금리 막대 + 최고금리 기준선(세로 막대형). groups: [{label, bars:[{value,text,color}]}]
function columnChart(groups, maxLine, opts = {}) {
  const W = 760, H = 340, l = 56, r = 20, t = 34, b = 290;
  const max = opts.max;
  const Y = v => b - (b - t) * v / max;
  const gw = (W - l - r) / groups.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || '')}">`;
  for (let v = 0; v <= max + 1e-9; v += opts.step) {
    s += `<line x1="${l}" y1="${Y(v)}" x2="${W-r}" y2="${Y(v)}" stroke="${v === 0 ? '#5f6b7a' : '#e3e7ed'}"/>
      <text x="${l-8}" y="${Y(v)+4}" font-size="13" text-anchor="end" fill="#5f6b7a">${v.toFixed(1)}%</text>`;
  }
  groups.forEach((g, i) => {
    const n = g.bars.length, bw = Math.min(64, gw * 0.62 / n), x0 = l + gw * i + (gw - bw * n - 6 * (n - 1)) / 2;
    g.bars.forEach((bar, j) => {
      const x = x0 + j * (bw + 6);
      s += `<rect x="${x}" y="${Y(bar.value)}" width="${bw}" height="${b - Y(bar.value)}" fill="${bar.color}"/>
        <text x="${x + bw/2}" y="${Y(bar.value) - 7}" font-size="15" font-weight="bold" text-anchor="middle" fill="#222833">${esc(bar.text)}</text>`;
    });
    s += `<text x="${l + gw * i + gw/2}" y="${b + 24}" font-size="15" text-anchor="middle" fill="#222833" font-weight="bold">${esc(g.label)}</text>`;
  });
  if (maxLine) {
    s += `<line x1="${l}" y1="${Y(maxLine.value)}" x2="${W-r}" y2="${Y(maxLine.value)}" stroke="#a3271d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="${W-r}" y="${Y(maxLine.value) - 8}" font-size="14" font-weight="bold" text-anchor="end" fill="#a3271d">${esc(maxLine.text)}</text>`;
  }
  return s + '</svg>';
}
function stepChart(steps, value, unitFmt, valueLabel) {
  // steps: [[threshold, reward]] — 사용액 구간별 혜택 계단 그래프
  const W = 760, H = 220, l = 70, b = 172, t = 30;
  const maxX = steps[steps.length-1][0] * 1.35, maxY = steps[steps.length-1][1] * 1.15;
  const X = v => l + (W - l - 20) * Math.min(v, maxX) / maxX, Y = v => b - (b - t) * v / maxY;
  let path = `M${X(0)},${Y(0)}`, prevY = Y(0);
  steps.forEach(([th, rw]) => { path += ` L${X(th)},${prevY} L${X(th)},${Y(rw)}`; prevY = Y(rw); });
  path += ` L${X(maxX)},${Y(steps[steps.length-1][1])}`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="사용액별 혜택">
    <line x1="${l}" y1="${b}" x2="${W-10}" y2="${b}" stroke="#98a2b3"/><line x1="${l}" y1="${t}" x2="${l}" y2="${b}" stroke="#98a2b3"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  steps.forEach(([th, rw]) => {
    s += `<circle cx="${X(th)}" cy="${Y(rw)}" r="5" fill="var(--accent)"/>
      <text x="${X(th)}" y="${Y(rw)-8}" font-size="14" text-anchor="middle" font-weight="bold">${esc(unitFmt(rw))}</text>
      <text x="${X(th)}" y="${b+20}" font-size="13" text-anchor="middle" fill="#667085">${esc(manwon(th))}</text>`;
  });
  if (value != null) {
    s += `<line x1="${X(value)}" y1="${t}" x2="${X(value)}" y2="${b}" stroke="#a3271d" stroke-dasharray="4 3" stroke-width="2"/>
      <text x="${Math.min(X(value), W-90)}" y="${t+2}" font-size="14" fill="#a3271d" font-weight="bold">▼ ${esc(valueLabel)}</text>`;
  }
  return s + `<text x="${l}" y="${H-6}" font-size="12" fill="#5f6b7a">가로: 사용액 · 세로: 받을 수 있는 혜택</text></svg>`;
}

/* ---------- 계산기 ---------- */
function depositCalc(p, amt, term, useMax) {
  const r = R[p.id];
  const rate = useMax ? r.max : r.terms[term];
  let principal, interest;
  if (r.kind === 'save') {
    principal = amt * 10000 * term;
    interest = amt * 10000 * (rate/100) / 12 * term * (term + 1) / 2;   // 매월 같은 날 납입, 단리
  } else {
    principal = amt * 10000;
    interest = principal * (rate/100) * term / 12;                       // 단리
  }
  return { rate, principal, interest, after: interest * (1 - TAX) };
}
function cardBenefit(p, spend, extra = {}) {
  // spend: 월 사용액(만원). 반환: { monthly, yearly, text, note, ok }
  const r = R[p.id], s = spend * 10000;
  switch (p.id) {
    case 'CRD-01': case 'CRD-04': {
      const tier = [...r.tiers].reverse().find(([th]) => spend >= th);
      const cap = tier ? tier[1] : 0;
      return { monthly:cap, text: cap ? `월 최대 ${won(cap)} 할인 한도` : '전월 실적 미달 — 할인 없음',
        note:'할인 한도(최대치)입니다. 실제 할인은 쿠팡·편의점·커피 등 대상 가맹점에서 쓴 만큼만 생깁니다.', ok: !!cap };
    }
    case 'CRD-02': {
      const yr = spend * 12;
      const tier = [...r.yearTiers].reverse().find(([th]) => yr >= th);
      const cb = tier ? tier[1] : Math.floor(yr * 10000 * 0.001 / 1000) * 1000 >= 1000 ? yr * 10000 * 0.001 : 0;
      return { yearly:cb, text:`연간 ${manwon(yr)} 사용 → 캐시백 ${won(cb)}`, note: tier ? '발급일 기준 12개월 이용금액 기준, 13개월 후 지정계좌 입금' : '연 500만원 미만이면 이용금액의 0.1%(1천원 미만 미지급)', ok: !!tier };
    }
    case 'CRD-03': {
      if (spend < r.minSpend) return { monthly:0, text:'전월 실적 50만원 미달 — 캐시백 없음', note:'', ok:false };
      const share = (extra.topShare ?? 50) / 100;
      const base = s * 0.01, add = Math.min(s * share * 0.01, 100000);
      return { monthly: base + add, text:`기본 ${won(base)} + 추가 ${won(add)} = 월 ${won(base+add)}`,
        note:`사용액 전부가 6대 생활영역이고, 가장 많이 쓴 영역 비중이 ${Math.round(share*100)}%라고 가정했습니다(공식 예시: 월 100만원 → 1만5천원).`, ok:true };
    }
    case 'CRD-05': {
      const tShare = (extra.timeShare ?? 30) / 100;
      const base = s * (1 - tShare) * 0.002;
      const time = spend >= 30 ? s * tShare * 0.006 : s * tShare * 0.002;
      return { monthly: base + time, text:`월 약 ${won(base + time)} 캐시백`,
        note:`점심·저녁 시간 사용 비중 ${Math.round(tShare*100)}% 가정. 타임캐시백 0.6%는 전월 30만원 이상일 때만 적용(미달 시 0.2%).`, ok:true };
    }
    case 'CRD-06': {
      if (spend < r.minSpend) return { monthly:0, text:'전월 실적 30만원 미달 — 적립 없음', note:'', ok:false };
      const miles = Math.floor(Math.min(s, 1000000) / 3000);
      return { monthly: null, miles, text:`일반 적립 월 약 ${miles.toLocaleString()}마일`,
        note:'국내 가맹점 결제가 모두 건당 3만원 이상이라고 가정(일반 적립 월 100만원까지 인정). 5개 온라인몰 SUPER 적립은 별도.', ok:true };
    }
  }
}

function quiz(p) {

    q.push(['이 상품은 예금자보호 대상인가요?', p.protection]);

    q.push(['고객이 만기 전에 해지하면 어떻게 되나요?', p.cautions.find(c => c.includes('중도')) || p.cautions[0]]);
    q.push(['가입 금액과 기간 조건은?', `${p.amount} / ${p.term}`]);
    q.push(['어디서 가입할 수 있나요?', p.channels]);
  } else if (r.kind === 'card') {
    q.push(['연회비는 얼마인가요?', p.annual_fee]);
    q.push(['혜택을 받으려면 전월 실적이 얼마나 필요한가요?', p.requirement]);
    q.push(['대표 혜택 두 가지는?', p.benefits.slice(0,2).join(' / ')]);
    q.push(['혜택에서 빠지는 경우는?', p.cautions.join(' / ')]);
    if (p.limits) q.push(['할인 한도는?', p.limits]);
  } else {
    q.push(['이 보험은 어느 보험회사 상품인가요?', `${p.insurer}. 은행은 판매를 대행합니다.`]);
    q.push(['핵심 특징은?', p.highlights.join(' / ')]);
    q.push(['고객이 보장 금액을 물으면 어떻게 답하나요?', '홈페이지에 수치가 공개되어 있지 않으므로 추측하지 말고 상품안내장·약관(PDF)을 함께 보며 안내합니다.']);
    q.push(['예금과 가장 크게 다른 점은?', '보험은 예금이 아니며 중도해지 시 해지환급금이 낸 보험료보다 적을 수 있습니다.']);
  }
  return q;
}

function rankAll(pf) {
  return P.map(x => {
    const r = R[x.id]; let score = 0; const why = [];
    const hit = r.tags.filter(t => pf.needs.includes(t));
    if (!hit.length) return null;
    score += 3 * hit.length; why.push(`니즈 일치: ${hit.join(', ')}`);
    if (r.kind === 'save') {
      if (pf.monthly < r.monthly[0]) { score -= 5; why.push('월 납입액 부족'); }
      else if (pf.monthly > r.monthly[1]) { score -= 1; why.push(`월 한도 ${manwon(r.monthly[1])}`); }
    }
    if (r.kind === 'lump') {
      if (pf.lump < r.lump[0]) { score -= 5; why.push(`최소 ${manwon(r.lump[0])}`); }
      else why.push(`목돈 ${manwon(pf.lump)} 가입 가능`);
    }
    if (r.kind === 'save' || r.kind === 'lump') {
      if (pf.protNeed) {
        if (r.prot === 'yes') { score += 1; why.push('예금자보호'); }
        else if (r.prot === 'gov') why.push('정부(주택도시기금) 별도 관리');
        else { score -= 2; why.push('예금자보호 아님'); }
      }
      if (r.mainBank && pf.salaryIbk) { score += 1; why.push('주거래 우대 가능'); }
      if (x.id === 'DEP-01' && pf.newToIbk) { score += 1; why.push('최초 거래 우대'); }
      if (x.id === "DEP-07" && pf.needs.includes("내 집 마련")) { score += 3; why.push("청약 자격 준비(1인 1계좌, 미보유 시 우선)"); }
      score += r.max / 10;   // 같은 점수면 최고금리가 높은 쪽
    }
    if (r.kind === 'card') {
      if (x.id === 'CRD-02') { if (pf.spend * 12 >= 1000) { score += 1; why.push(`연 ${manwon(pf.spend*12)} → 정액 캐시백`); } else { score -= 4; why.push('연간 사용액 부족'); } }
      else if (r.minSpend) { if (pf.spend >= r.minSpend) why.push(`전월 ${manwon(r.minSpend)} 실적 충족`); else { score -= 4; why.push('전월 실적 미달'); } }
      if (r.credit && pf.preferCheck) { score -= 3; why.push('신용카드 부담 고객'); }
      if (!r.credit && pf.preferCheck) { score += 1; why.push('연회비 없는 체크카드'); }
    }
    if (r.kind === 'ins' && !pf.needs.some(n => ['노후 준비','세액공제','건강 대비'].includes(n))) { score -= 3; why.push('보험은 예금이 아님'); }
    else if (r.kind === 'ins' && pf.protNeed) { score -= 2; why.push('예금과 달리 중도해지 시 손실 가능'); }
    if (r.remoteOnly && pf.channel === 'branch') { score -= 2; why.push('비대면 전용(앱 도움 필요)'); }
    return { x, score, why };

document.getElementById('print-all').onclick = () => {
  document.body.classList.add('print-all');
  document.querySelectorAll('details.flash').forEach(d => d.open = true);
  window.print();
  setTimeout(() => document.body.classList.remove('print-all'), 500);
};
window.addEventListener('beforeprint', () => document.querySelectorAll('details.flash').forEach(d => d.open = true));
document.getElementById('rep-guide').addEventListener('input', ev => { if (ev.target.closest('.calc')) runCalcs(document.getElementById('rep-guide')); });
const tellerEl = document.getElementById('rep-teller');
tellerEl.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.ck != null) { (checked[cur] ||= {})[el.dataset.ck] = el.checked; return; }
  if (el.dataset.need) { profile.needs = [...tellerEl.querySelectorAll('[data-need]:checked')].map(x => x.dataset.need); renderTellerOnly(); return; }
  if (el.dataset.p) {
    const k = el.dataset.p;
    profile[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' || k === 'term' ? Number(el.value) || 0 : el.value;
    renderTellerOnly();
  }
});
tellerEl.addEventListener('input', ev => {
  if (ev.target.classList.contains('memo')) { profile.memo = ev.target.value; tellerEl.querySelector('.memo-print').textContent = profile.memo; }
});

document.querySelectorAll('[data-icon]').forEach(e => e.outerHTML = icon(e.dataset.icon));
renderList();
renderReports();
</script>
</body>
</html>
