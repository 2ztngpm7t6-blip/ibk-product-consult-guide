<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBK 상품 상담 가이드</title>
<style>
  :root {
    --ink:#1d2433; --muted:#667085; --line:#dfe3ea; --bg:#f4f6fa; --card:#fff; --soft:#f8fafc;
    --brand:#0b4ea2; --brand-soft:#e8f0fb;
    --edu:#6941c6; --edu-soft:#f1ecfb; --guide:#0b7a75; --guide-soft:#e6f5f4; --teller:#0b4ea2; --teller-soft:#e8f0fb;
    --ok:#067647; --ok-soft:#e7f6ec; --warn:#b54708; --warn-soft:#fff4e5; --bad:#b42318; --bad-soft:#fdecea;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; color:var(--ink); background:var(--bg); line-height:1.55; font-size:15px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  a { color:var(--brand); }

  .topbar { background:var(--brand); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  .topbar h1 { margin:0; font-size:19px; }
  .topbar .sub { font-size:13px; opacity:.85; }
  .topbar .date { margin-left:auto; background:rgba(255,255,255,.15); border-radius:999px; padding:3px 12px; font-size:13px; }

  .layout { display:grid; grid-template-columns:300px 1fr; gap:16px; padding:16px; max-width:1320px; margin:0 auto; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; padding:12px; } }

  aside { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; align-self:start; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; }
  @media (max-width:900px) { aside { position:static; max-height:none; } }
  aside h2 { font-size:14px; margin:0 0 8px; color:var(--muted); }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 11px; cursor:pointer; font-size:13px; }
  .chip.on { background:var(--brand); color:#fff; border-color:var(--brand); }
  .plist { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  .pitem { border:1px solid var(--line); border-radius:10px; padding:9px 10px; cursor:pointer; background:var(--card); text-align:left; width:100%; }
  .pitem:hover { border-color:var(--brand); }
  .pitem.on { border-color:var(--brand); background:var(--brand-soft); box-shadow:inset 3px 0 0 var(--brand); }
  .pitem .nm { font-weight:bold; font-size:14px; display:block; }
  .pitem .ol { font-size:12px; color:var(--muted); display:block; }
  .pitem .kv { font-size:12px; color:var(--brand); font-weight:bold; }

  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tab { flex:1 1 180px; border:2px solid var(--line); background:var(--card); border-radius:12px; padding:10px 12px; cursor:pointer; text-align:left; }
  .tab b { display:block; font-size:15px; }
  .tab span { font-size:12px; color:var(--muted); }
  .tab[data-k=edu].on { border-color:var(--edu); background:var(--edu-soft); }
  .tab[data-k=guide].on { border-color:var(--guide); background:var(--guide-soft); }
  .tab[data-k=teller].on { border-color:var(--teller); background:var(--teller-soft); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .btn { border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:8px; padding:7px 14px; cursor:pointer; }
  .btn.ghost { background:var(--card); color:var(--brand); }

  .report { display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 26px; }
  .report.active { display:block; }
  @media (max-width:600px) { .report { padding:16px; } }
  .rhead { border-bottom:3px solid var(--accent); padding-bottom:12px; margin-bottom:16px; }
  .rhead .kind { display:inline-block; background:var(--accent); color:#fff; border-radius:6px; padding:2px 10px; font-size:13px; }
  .rhead h2 { margin:6px 0 2px; font-size:23px; }
  .rhead .meta { font-size:12.5px; color:var(--muted); }
  #rep-edu { --accent:var(--edu); --accent-soft:var(--edu-soft); }
  #rep-guide { --accent:var(--guide); --accent-soft:var(--guide-soft); }
  #rep-teller { --accent:var(--teller); --accent-soft:var(--teller-soft); }
  .report h3 { font-size:17px; margin:24px 0 10px; padding-left:9px; border-left:4px solid var(--accent); }
  .report h4 { font-size:14px; margin:12px 0 4px; }
  .lead { font-size:16px; background:var(--accent-soft); border-radius:10px; padding:12px 14px; }

  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
  th { background:var(--soft); white-space:nowrap; }
  .tbl-wrap { overflow-x:auto; }
  tr.me td { background:var(--accent-soft); font-weight:bold; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .tile { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--soft); }
  .tile .l { font-size:12.5px; color:var(--muted); }
  .tile .v { font-size:21px; font-weight:bold; color:var(--accent); line-height:1.3; }
  .tile .s { font-size:12px; color:var(--muted); }

  .badge { display:inline-block; border-radius:999px; padding:2px 10px; font-size:12.5px; font-weight:bold; }
  .b-ok { background:var(--ok-soft); color:var(--ok); } .b-warn { background:var(--warn-soft); color:var(--warn); } .b-bad { background:var(--bad-soft); color:var(--bad); }
  .box { border-radius:10px; padding:11px 14px; margin:8px 0; }
  .box.warn { background:var(--warn-soft); border:1px solid #f5c98b; }
  .box.bad { background:var(--bad-soft); border:1px solid #f3b4ae; }
  .box.ok { background:var(--ok-soft); border:1px solid #a6dcb8; }
  .box.info { background:var(--soft); border:1px solid var(--line); }
  ul.clean { margin:6px 0; padding-left:20px; } ul.clean li { margin:3px 0; }
  .checks { list-style:none; padding:0; margin:6px 0; } .checks li { padding:6px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; }
  .checks .ic { flex:0 0 22px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:700px){ .grid2 { grid-template-columns:1fr; } }
  .muted { color:var(--muted); } .small { font-size:12.5px; }

  .flash { border:1px solid var(--line); border-radius:10px; margin:8px 0; overflow:hidden; }
  .flash summary { cursor:pointer; padding:10px 12px; background:var(--soft); font-weight:bold; list-style:none; }
  .flash summary::before { content:"Q. "; color:var(--accent); }
  .flash div { padding:10px 12px; } .flash div::before { content:"A. "; font-weight:bold; color:var(--ok); }

  .script { border-left:3px solid var(--accent); padding:4px 0 4px 12px; margin:10px 0; }
  .script .step { font-size:12.5px; font-weight:bold; color:var(--accent); }
  .script p { margin:3px 0; }
  .say { background:var(--soft); border-radius:8px; padding:8px 11px; margin:4px 0; }
  .say::before { content:"화법"; display:inline-block; font-size:11px; font-weight:bold; color:#fff; background:var(--accent); border-radius:4px; padding:0 5px; margin-right:7px; vertical-align:1px; }

  .calc { border:1px dashed var(--accent); border-radius:12px; padding:12px 14px; background:var(--card); }
  .calc label { display:inline-flex; flex-direction:column; font-size:12.5px; color:var(--muted); margin:0 12px 8px 0; }
  .calc input, .calc select, .form input, .form select, .form textarea { border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:#fff; min-width:120px; }
  .calc .res { font-size:15px; margin-top:6px; }
  .calc .big { font-size:24px; font-weight:bold; color:var(--accent); }

  .form { background:var(--teller-soft); border:1px solid #c9d9f2; border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .form h3 { margin:0 0 10px; font-size:16px; border:0; padding:0; }
  .form .row { display:flex; flex-wrap:wrap; gap:10px 14px; }
  .form label { display:flex; flex-direction:column; font-size:12.5px; color:var(--muted); }
  .form .needs { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .form .needs label { flex-direction:row; align-items:center; gap:4px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--ink); font-size:13px; cursor:pointer; }
  .form .flags { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:6px; }
  .form .flags label { flex-direction:row; gap:5px; color:var(--ink); font-size:13.5px; align-items:center; }
  .form input[type=checkbox], .principles input[type=checkbox] { min-width:0; width:auto; margin:0; }
  .presets { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:12px; }
  .preset { border:1px solid #c9d9f2; background:#fff; border-radius:10px; padding:8px 10px; cursor:pointer; text-align:left; }
  .preset b { display:block; font-size:14px; } .preset span { font-size:12px; color:var(--muted); }
  .preset.on { border:2px solid var(--teller); background:#fff; box-shadow:0 0 0 3px #c9d9f2; }
  .rank { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px; }
  .rank li { background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .rank .no { font-weight:bold; color:var(--teller); font-size:16px; }
  .rank .why { font-size:12.5px; color:var(--muted); flex:1 1 260px; }
  .rank li.me { border-color:var(--teller); background:var(--teller-soft); }

  .recs { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .rec { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--soft); }
  .rec b { display:block; } .rec .why { font-size:13px; }
  .rec button { margin-top:6px; font-size:12.5px; padding:3px 10px; }

  .principles { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:6px 14px; }
  .principles label { display:flex; gap:7px; align-items:flex-start; font-size:14px; }
  textarea.memo { width:100%; min-height:70px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .memo-print { display:none; white-space:pre-wrap; border:1px solid var(--line); border-radius:8px; padding:8px; min-height:50px; }

  svg text { font-family:inherit; }
  svg.i { width:1.05em; height:1.05em; vertical-align:-0.15em; flex:0 0 auto; }
  svg.i.bi { margin-right:6px; color:var(--accent, var(--brand)); }
  svg.i.cat { color:var(--brand); margin-right:4px; }
  .tab b svg.i, .btn svg.i { margin-right:6px; }
  .btn svg.i:last-child:not(:first-child) { margin:0 0 0 4px; }
  .topbar .logo { height:26px; display:block; }
  .topbar h1 { display:flex; align-items:center; gap:12px; }
  .topbar h1 .sep { width:1px; height:18px; background:rgba(255,255,255,.4); }
  .rhead .blogo { height:24px; display:block; margin-bottom:10px; }
  .rhead .kind svg.i { margin-right:5px; }
  .badge svg.i { margin-right:3px; }
  .ic { display:inline-flex; align-items:center; justify-content:center; }
  .ic-ok { color:var(--ok); } .ic-warn { color:var(--warn); } .ic-bad { color:var(--bad); } .ic-info { color:var(--brand); }
  .checks .ic svg.i { width:19px; height:19px; }
  .box > b svg.i, .box b:first-child svg.i { vertical-align:-0.2em; }
  .switch { border:2px solid var(--teller); background:#fff; border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .switch .sw-head b { white-space:nowrap; }
  .switch .sw-head { display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; } .switch .sw-head svg.i { color:var(--teller); margin-top:3px; }
  .switch table { margin-bottom:10px; } .switch th:first-child { width:110px; }
  .principles label { padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; align-items:center; }
  .principles label:has(input:checked) { border-color:var(--ok); background:var(--ok-soft); }
  .principles input[type=checkbox] { width:24px; height:24px; min-width:24px; margin:0; accent-color:var(--ok); cursor:pointer; flex:0 0 24px; }
  .chart { width:100%; height:auto; }
  .legend { font-size:12.5px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; margin-top:2px; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:4px; }

  .src { font-size:12.5px; color:var(--muted); border-top:1px solid var(--line); margin-top:24px; padding-top:10px; }
  .disclaimer { font-size:12px; color:var(--muted); margin-top:6px; }
  .empty { padding:40px; text-align:center; color:var(--muted); }

  @media print {
    @page { margin:14mm; }
    body { background:#fff; font-size:12.5px; }
    .topbar, aside, .tabs, .actions, .no-print { display:none !important; }
    .layout { display:block; padding:0; max-width:none; }
    .report { border:0; padding:0; }
    body.print-all .report { display:block; page-break-after:always; }
    .memo-print { display:block; }
    details.flash > div { display:block; }
    a { color:inherit; text-decoration:none; }
    .tile, .box, .rec, .flash, table, .script, svg { break-inside:avoid; }
  }
</style>
</head>

<div class="layout">
  <aside>
    <h2>① 상품 고르기</h2>
    <div class="filters" id="filters"></div>
    <ul class="plist" id="plist"></ul>

  <main>
    <div class="tabs" id="tabs">
      <button class="tab on" data-k="edu"><b><span data-icon="edu"></span>직원 교육용</b><span>상품 구조 · 비교 · 퀴즈 · 롤플레이</span></button>
      <button class="tab" data-k="guide"><b><span data-icon="guide"></span>고객 안내용</b><span>쉬운 설명 · 내 이자/혜택 계산 · 주의사항</span></button>
      <button class="tab" data-k="teller"><b><span data-icon="teller"></span>창구 영업용</b><span>고객 맞춤 적합성 · 화법 · 교차판매 · 점검표</span></button>

    <div class="actions">
      <button class="btn" id="print-one"><span data-icon="printer"></span>이 보고서 PDF 저장/인쇄</button>
      <button class="btn ghost" id="print-all"><span data-icon="files"></span>보고서 3종 한 번에 PDF</button>
    </div>
    <article class="report active" id="rep-edu"></article>
    <article class="report" id="rep-guide"></article>
    <article class="report" id="rep-teller"></article>
  </main>
</div>

function protBadge(p) {
  const r = R[p.id];
  if (r.kind === 'card') return '';
  if (r.kind === 'ins') return '<span class="badge b-warn">보험상품 · 예금 아님</span>';
  if (r.prot === 'yes') return `<span class="badge b-ok">${icon('check')}예금자보호 대상</span>`;
  if (r.prot === 'gov') return '<span class="badge b-warn">예금자보호 아님 · 정부(주택도시기금) 별도 관리</span>';
  return `<span class="badge b-bad">${icon('x')}예금자보호 대상 아님(채권)</span>`;
}

}

}
function rateRows(p) {
  const r = R[p.id];
  return Object.keys(r.terms).map(Number).sort((a,b) => a-b).map(t => ({ t, rate:r.terms[t], base:r.base ? r.base[t] : null }));
}
function termLabel(t) { return t % 12 === 0 ? `${t/12}년` : `${t}개월`; }

/* ---------- SVG 차트 ---------- */
function barChart(rows, opts = {}) {
  // rows: [{label, value, color, note}]
  const W = 640, rowH = 34, left = opts.left || 190, top = 8;
  const H = top + rows.length * rowH + 22;
  const max = opts.max || Math.max(...rows.map(r => r.value)) * 1.15 || 1;
  const sx = v => (W - left - 70) * v / max;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || '')}">`;
  for (let g = 0; g <= 4; g++) {
    const x = left + (W - left - 70) * g / 4;
    s += `<line x1="${x}" y1="${top}" x2="${x}" y2="${H-20}" stroke="#e5e7eb"/>
          <text x="${x}" y="${H-5}" font-size="11" fill="#98a2b3" text-anchor="middle">${opts.fmt ? opts.fmt(max*g/4) : (max*g/4).toFixed(1)}</text>`;
  }
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    s += `<text x="${left-8}" y="${y+21}" font-size="12.5" text-anchor="end" fill="#1d2433" ${r.bold ? 'font-weight="bold"' : ''}>${esc(r.label)}</text>
          <rect x="${left}" y="${y+6}" width="${Math.max(2, sx(r.value))}" height="${rowH-14}" rx="4" fill="${r.color}"/>
          <text x="${left + sx(r.value) + 6}" y="${y+21}" font-size="12.5" font-weight="bold" fill="#1d2433">${esc(r.text ?? r.value)}</text>`;
  });
  return s + '</svg>';
}
// 기간별 금리 막대 + 최고금리 기준선(세로 막대형). groups: [{label, bars:[{value,text,color}]}]
function columnChart(groups, maxLine, opts = {}) {
  const W = 760, H = 340, l = 56, r = 20, t = 34, b = 290;
  const max = opts.max;
  const Y = v => b - (b - t) * v / max;
  const gw = (W - l - r) / groups.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || '')}">`;
  for (let v = 0; v <= max + 1e-9; v += opts.step) {
    s += `<line x1="${l}" y1="${Y(v)}" x2="${W-r}" y2="${Y(v)}" stroke="${v === 0 ? '#5f6b7a' : '#e3e7ed'}"/>
      <text x="${l-8}" y="${Y(v)+4}" font-size="13" text-anchor="end" fill="#5f6b7a">${v.toFixed(1)}%</text>`;
  }
  groups.forEach((g, i) => {
    const n = g.bars.length, bw = Math.min(64, gw * 0.62 / n), x0 = l + gw * i + (gw - bw * n - 6 * (n - 1)) / 2;
    g.bars.forEach((bar, j) => {
      const x = x0 + j * (bw + 6);
      s += `<rect x="${x}" y="${Y(bar.value)}" width="${bw}" height="${b - Y(bar.value)}" fill="${bar.color}"/>
        <text x="${x + bw/2}" y="${Y(bar.value) - 7}" font-size="15" font-weight="bold" text-anchor="middle" fill="#222833">${esc(bar.text)}</text>`;
    });
    s += `<text x="${l + gw * i + gw/2}" y="${b + 24}" font-size="15" text-anchor="middle" fill="#222833" font-weight="bold">${esc(g.label)}</text>`;
  });
  if (maxLine) {
    s += `<line x1="${l}" y1="${Y(maxLine.value)}" x2="${W-r}" y2="${Y(maxLine.value)}" stroke="#a3271d" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="${W-r}" y="${Y(maxLine.value) - 8}" font-size="14" font-weight="bold" text-anchor="end" fill="#a3271d">${esc(maxLine.text)}</text>`;
  }
  return s + '</svg>';
}
function stepChart(steps, value, unitFmt, valueLabel) {
  // steps: [[threshold, reward]] — 사용액 구간별 혜택 계단 그래프
  const W = 640, H = 170, l = 60, b = 130, t = 18;
  const maxX = steps[steps.length-1][0] * 1.35, maxY = steps[steps.length-1][1] * 1.15;
  const X = v => l + (W - l - 20) * Math.min(v, maxX) / maxX, Y = v => b - (b - t) * v / maxY;
  let path = `M${X(0)},${Y(0)}`, prevY = Y(0);
  steps.forEach(([th, rw]) => { path += ` L${X(th)},${prevY} L${X(th)},${Y(rw)}`; prevY = Y(rw); });
  path += ` L${X(maxX)},${Y(steps[steps.length-1][1])}`;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="사용액별 혜택">
    <line x1="${l}" y1="${b}" x2="${W-10}" y2="${b}" stroke="#98a2b3"/><line x1="${l}" y1="${t}" x2="${l}" y2="${b}" stroke="#98a2b3"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
  steps.forEach(([th, rw]) => {
    s += `<circle cx="${X(th)}" cy="${Y(rw)}" r="4" fill="var(--accent)"/>
      <text x="${X(th)}" y="${Y(rw)-8}" font-size="11.5" text-anchor="middle" font-weight="bold">${esc(unitFmt(rw))}</text>
      <text x="${X(th)}" y="${b+16}" font-size="11" text-anchor="middle" fill="#667085">${esc(manwon(th))}</text>`;
  });
  if (value != null) {
    s += `<line x1="${X(value)}" y1="${t}" x2="${X(value)}" y2="${b}" stroke="#b54708" stroke-dasharray="4 3" stroke-width="2"/>
      <text x="${Math.min(X(value), W-90)}" y="${t+2}" font-size="12" fill="#b54708" font-weight="bold">▼ ${esc(valueLabel)}</text>`;
  }
  return s + `<text x="${l}" y="${H-6}" font-size="11" fill="#667085">가로: 사용액 · 세로: 받을 수 있는 혜택</text></svg>`;
}

/* ---------- 계산기 ---------- */
function depositCalc(p, amt, term, useMax) {
  const r = R[p.id];
  const rate = useMax ? r.max : r.terms[term];
  let principal, interest;
  if (r.kind === 'save') {
    principal = amt * 10000 * term;
    interest = amt * 10000 * (rate/100) / 12 * term * (term + 1) / 2;   // 매월 같은 날 납입, 단리
  } else {
    principal = amt * 10000;
    interest = principal * (rate/100) * term / 12;                       // 단리
  }
  return { rate, principal, interest, after: interest * (1 - TAX) };
}
function cardBenefit(p, spend, extra = {}) {
  // spend: 월 사용액(만원). 반환: { monthly, yearly, text, note, ok }
  const r = R[p.id], s = spend * 10000;
  switch (p.id) {
    case 'CRD-01': case 'CRD-04': case 'CRD-07': case 'CRD-08': {
      const tier = [...r.tiers].reverse().find(([th]) => spend >= th);
      const cap = tier ? tier[1] : 0;
      return { monthly:cap, text: cap ? `월 최대 ${won(cap)} 할인 한도` : '전월 실적 미달 — 할인 없음',
        note:'할인 한도(최대치)입니다. 실제 할인은 카드별 할인 대상 가맹점에서 쓴 만큼만 생깁니다.', ok: !!cap };
    }
    case 'CRD-02': {
      const yr = spend * 12;
      const tier = [...r.yearTiers].reverse().find(([th]) => yr >= th);
      const cb = tier ? tier[1] : Math.floor(yr * 10000 * 0.001 / 1000) * 1000 >= 1000 ? yr * 10000 * 0.001 : 0;
      return { yearly:cb, text:`연간 ${manwon(yr)} 사용 → 캐시백 ${won(cb)}`, note: tier ? '발급일 기준 12개월 이용금액 기준, 13개월 후 지정계좌 입금' : '연 500만원 미만이면 이용금액의 0.1%(1천원 미만 미지급)', ok: !!tier };
    }
    case 'CRD-03': {
      if (spend < r.minSpend) return { monthly:0, text:'전월 실적 50만원 미달 — 캐시백 없음', note:'', ok:false };
      const share = (extra.topShare ?? 50) / 100;
      const base = s * 0.01, add = Math.min(s * share * 0.01, 100000);
      return { monthly: base + add, text:`기본 ${won(base)} + 추가 ${won(add)} = 월 ${won(base+add)}`,
        note:`사용액 전부가 6대 생활영역이고, 가장 많이 쓴 영역 비중이 ${Math.round(share*100)}%라고 가정했습니다(공식 예시: 월 100만원 → 1만5천원).`, ok:true };
    }
    case 'CRD-05': {
      const tShare = (extra.timeShare ?? 30) / 100;
      const base = s * (1 - tShare) * 0.002;
      const time = spend >= 30 ? s * tShare * 0.006 : s * tShare * 0.002;
      return { monthly: base + time, text:`월 약 ${won(base + time)} 캐시백`,
        note:`점심·저녁 시간 사용 비중 ${Math.round(tShare*100)}% 가정. 타임캐시백 0.6%는 전월 30만원 이상일 때만 적용(미달 시 0.2%).`, ok:true };
    }
    case 'CRD-06': {
      if (spend < r.minSpend) return { monthly:0, text:'전월 실적 30만원 미달 — 적립 없음', note:'', ok:false };
      const miles = Math.floor(Math.min(s, 1000000) / 3000);
      return { monthly: null, miles, text:`일반 적립 월 약 ${miles.toLocaleString()}마일`,
        note:'국내 가맹점 결제가 모두 건당 3만원 이상이라고 가정(일반 적립 월 100만원까지 인정). 5개 온라인몰 SUPER 적립은 별도.', ok:true };
    }
  }
}

    if (rx.kind === 'card' && R[p.id].kind !== 'card' && !pf.hasIbkCard) {
      if (R[p.id].mainBank) { score += 2; why.push('IBK카드 월 30만원·3개월 사용이 이 상품의 주거래 우대조건 ④'); }

    if (rx.mainBank && R[p.id].kind === 'card') { score += 2; why.push('IBK카드 사용이 주거래 우대조건이 되어 금리를 더 받을 수 있음'); }

    if (rx.remoteOnly && pf.channel === 'branch') score -= 1;

      <label>월 저축 가능액(만원)<input type="number" min="0" data-p="monthly" value="${pf.monthly}"></label>
      <label>희망 기간<select data-p="term">${[3,6,12,24,36].map(t => `<option value="${t}" ${t===pf.term?'selected':''}>${termLabel(t)}</option>`).join('')}</select></label>
      <label>월 카드 사용액(만원)<input type="number" min="0" data-p="spend" value="${pf.spend}"></label>
      <label>가입 채널<select data-p="channel"><option value="both" ${pf.channel==='both'?'selected':''}>영업점·앱 모두 가능</option><option value="branch" ${pf.channel==='branch'?'selected':''}>영업점만(앱 어려움)</option></select></label>
    </div>
    <div class="needs">${NEEDS.map(n => `<label><input type="checkbox" data-need="${n}" ${pf.needs.includes(n)?'checked':''}>${n}</label>`).join('')}</div>
    <div class="flags">
      <label><input type="checkbox" data-p="protNeed" ${pf.protNeed?'checked':''}>예금자보호 중요</label>
      <label><input type="checkbox" data-p="salaryIbk" ${pf.salaryIbk?'checked':''}>IBK 급여이체 중</label>
      <label><input type="checkbox" data-p="newToIbk" ${pf.newToIbk?'checked':''}>IBK 첫 거래</label>
      <label><input type="checkbox" data-p="hasIbkCard" ${pf.hasIbkCard?'checked':''}>IBK카드 보유</label>
      <label><input type="checkbox" data-p="preferCheck" ${pf.preferCheck?'checked':''}>신용카드 부담(체크카드 선호)</label>
    </div>
    <h3 style="margin-top:12px">${icon('award','bi')}이 고객에게 맞는 상품 순위 <span class="small muted">([이 상품으로 전환]을 누르면 고객 정보는 그대로 두고 보고서 3종을 그 상품 기준으로 다시 만듭니다)</span></h3>
    ${ranked.length ? `<ol class="rank">${ranked.map((o, i) => `<li class="${o.x.id===cur?'me':''}"><span class="no">${i+1}</span><b>${ICON[o.x.category]} ${esc(o.x.name)}</b><span class="why">${esc(o.why.join(' · '))}</span>${o.x.id===cur ? '<span class="badge b-ok">지금 보는 상품</span>' : `<button class="btn ghost" data-go="${o.x.id}" title="고객 정보는 그대로 두고 보고서 3종을 이 상품 기준으로 바꿉니다">이 상품으로 전환${icon('arrow')}</button>`}</li>`).join('')}</ol>` : '<p class="muted">니즈를 1개 이상 고르면 순위가 나옵니다.</p>'}
  </div>`;
}
// 전체 상품을 고객 프로필 기준으로 점수 매긴다(니즈 일치 + 가입조건·성향 감점).
function rankAll(pf) {
  return P.map(x => {
    const r = R[x.id]; let score = 0; const why = [];
    const hit = r.tags.filter(t => pf.needs.includes(t));
    if (!hit.length) return null;
    score += 3 * hit.length; why.push(`니즈 일치: ${hit.join(', ')}`);
    if (r.kind === 'save') {
      if (pf.monthly < r.monthly[0]) { score -= 5; why.push('월 납입액 부족'); }
      else if (pf.monthly > r.monthly[1]) { score -= 1; why.push(`월 한도 ${manwon(r.monthly[1])}`); }
    }
    if (r.kind === 'lump') {
      if (pf.lump < r.lump[0]) { score -= 5; why.push(`최소 ${manwon(r.lump[0])}`); }
      else why.push(`목돈 ${manwon(pf.lump)} 가입 가능`);
    }
    if (r.kind === 'save' || r.kind === 'lump') {
      if (pf.protNeed) {
        if (r.prot === 'yes') { score += 1; why.push('예금자보호'); }
        else if (r.prot === 'gov') why.push('정부(주택도시기금) 별도 관리');
        else { score -= 2; why.push('예금자보호 아님'); }
      }
      if (r.mainBank && pf.salaryIbk) { score += 1; why.push('주거래 우대 가능'); }
      if (x.id === 'DEP-01' && pf.newToIbk) { score += 1; why.push('최초 거래 우대'); }
      if (x.id === "DEP-07" && pf.needs.includes("내 집 마련")) { score += 3; why.push("청약 자격 준비(1인 1계좌, 미보유 시 우선)"); }
      score += r.max / 10;   // 같은 점수면 최고금리가 높은 쪽
    }
    if (r.kind === 'card') {
      if (x.id === 'CRD-02') { if (pf.spend * 12 >= 1000) { score += 1; why.push(`연 ${manwon(pf.spend*12)} → 정액 캐시백`); } else { score -= 4; why.push('연간 사용액 부족'); } }
      else if (r.minSpend) { if (pf.spend >= r.minSpend) why.push(`전월 ${manwon(r.minSpend)} 실적 충족`); else { score -= 4; why.push('전월 실적 미달'); } }
      if (r.credit && pf.preferCheck) { score -= 3; why.push('신용카드 부담 고객'); }
      if (!r.credit && pf.preferCheck) { score += 1; why.push('연회비 없는 체크카드'); }
    }
    if (r.kind === 'ins' && !pf.needs.some(n => ['노후 준비','세액공제','건강 대비','여행·마일리지'].includes(n))) { score -= 3; why.push('보험은 예금이 아님'); }
    else if (r.kind === 'ins' && pf.protNeed) { score -= 2; why.push('예금과 달리 중도해지 시 손실 가능'); }
    if (r.remoteOnly && pf.channel === 'branch') { score -= 2; why.push('비대면 전용(앱 도움 필요)'); }
    if (r.youth) { if (['20대','30대'].includes(pf.age)) { score += 1; why.push('청년 전용(나이 확인)'); } else { score -= 10; } }
    if (r.sme) { if (/중소|중기/.test(pf.job)) { score += 2; why.push('중소기업 재직자 전용'); } else { score -= 10; } }
    if (x.id === 'DEP-10' && !pf.needs.includes('자녀·육아')) score -= 3;
    if (x.id === 'DEP-11' && pf.needs.includes('내 집 마련') && ['20대','30대'].includes(pf.age)) { score += 3; why.push('무주택 청년이면 최대 연 4.5%'); }
    return { x, score, why };
  }).filter(o => o && o.score > 0).sort((a, b) => b.score - a.score).slice(0, 5);
}
// [이 상품으로 전환] 직후 보여 주는 비교 안내. 고객 프로필은 그대로이고 상품만 바뀐다.
function keyFact(p) {
  const r = R[p.id];
  if (r.kind === 'card') return `연회비 ${r.feeS} · ${r.spendS}`;
  if (r.kind === 'ins') return `${p.insurer} · ${r.headline}`;
  return `최고 연 ${pct(r.max)} · ${r.prot === 'yes' ? '예금자보호' : r.prot === 'gov' ? '정부 별도 관리' : '예금자보호 아님'}`;
}
function verdictOf(p, pf) {
  const c = fitChecks(p, pf);
  return c.some(x => x[0] === 'bad') ? ['bad', '부적합 가능성'] : c.some(x => x[0] === 'warn') ? ['warn', '조건부 적합'] : ['ok', '적합'];
}
function switchNotice(p, pf) {
  if (!switched || switched.from === p.id) return '';
  const a = byId[switched.from], va = verdictOf(a, pf), vb = verdictOf(p, pf);
  return `<div class="switch no-print"><div class="sw-head">${icon('swap')}<b>상품을 전환했습니다.</b> 입력한 고객 정보(${esc(pf.alias)} · ${esc(pf.age)})는 그대로이고, 보고서 3종이 새 상품 기준으로 다시 만들어졌습니다.</div>
    <div class="tbl-wrap"><table><tr><th></th><th>이전 상품</th><th>지금 상품</th></tr>
      <tr><th>상품</th><td>${esc(a.name)}</td><td><b>${esc(p.name)}</b></td></tr>
      <tr><th>핵심 조건</th><td>${esc(keyFact(a))}</td><td>${esc(keyFact(p))}</td></tr>
      <tr><th>이 고객 적합성</th><td><span class="ic ic-${va[0]}">${icon(va[0])}</span> ${va[1]}</td><td><span class="ic ic-${vb[0]}">${icon(vb[0])}</span> ${vb[1]}</td></tr></table></div>
    <button class="btn ghost" data-back="1">${icon('back')}이전 상품(${esc(a.name)})으로 돌아가기</button></div>`;
}
function renderTeller(p) {
  const r = R[p.id], pf = profile;
  let h = switchNotice(p, pf) + profileForm(pf);
  h += headBlock('창구 영업용', '창구 직원(상담 준비·기록)', p);
  h += `<div class="tbl-wrap"><table><tr><th>고객</th><td>${esc(pf.alias)} · ${esc(pf.age)} · ${esc(pf.job)}</td><th>니즈</th><td>${esc(pf.needs.join(', ') || '미입력')}</td></tr>
    <tr><th>자금</th><td>목돈 ${manwon(pf.lump)} · 월 ${manwon(pf.monthly)} · 희망 ${termLabel(pf.term)}</td><th>거래·성향</th><td>${[pf.salaryIbk && 'IBK 급여이체', pf.newToIbk && 'IBK 첫 거래', pf.hasIbkCard && 'IBK카드 보유', pf.protNeed && '예금자보호 중요', pf.channel==='branch' && '영업점 선호', `카드 월 ${manwon(pf.spend)}`].filter(Boolean).join(' · ')}</td></tr></table></div>`;

  const ps = PRESETS.find(s => s.key === pf.preset);
  if (ps) h += `<div class="box info"><b>${icon(ps.icon,'bi')}${ps.label} 고객 응대 포인트</b>${ul(ps.tips)}</div>`;

  const checks = fitChecks(p, pf);
  const bad = checks.filter(c => c[0] === 'bad').length, warn = checks.filter(c => c[0] === 'warn').length;
  const verdict = bad ? ['bad', icon('bad') + '이 고객에게는 맞지 않을 가능성이 큽니다 — 대안 상품을 먼저 검토하세요'] : warn ? ['warn', icon('warn') + '조건부 적합 — 아래 주의 항목을 확인하고 설명하세요'] : ['ok', icon('ok') + '이 고객에게 적합합니다'];
  h += `<h3>1. 적합성 판단</h3><div class="box ${verdict[0]}"><b>${verdict[1]}</b></div>`;
  const ic = { ok:icon('ok'), warn:icon('warn'), bad:icon('bad'), info:icon('info') };
  h += '<ul class="checks">' + checks.map(([k, t]) => `<li><span class="ic ic-${k}">${ic[k]}</span><span>${esc(t)}</span></li>`).join('') + '</ul>';

  h += '<h3>2. 이 고객 기준 예상 효과</h3>';
  if (r.kind === 'save' || r.kind === 'lump') {
    const terms = Object.keys(r.terms).map(Number);
    const term = terms.includes(pf.term) ? pf.term : terms.reduce((a,b) => Math.abs(b - pf.term) < Math.abs(a - pf.term) ? b : a);
    let amt = r.kind === 'save' ? Math.min(pf.monthly, r.monthly[1]) : (r.lump[1] ? Math.min(pf.lump, r.lump[1]) : pf.lump);
    const a = depositCalc(p, amt, term, false), b = depositCalc(p, amt, term, true);
    h += `<div class="tbl-wrap"><table><tr><th>가정</th><th>금리</th><th>세전 이자</th><th>세후 이자</th></tr>
      <tr><td>${r.kind==='save' ? '월 '+manwon(amt) : manwon(amt)} · ${termLabel(term)} · ${r.base?'적용':'기본'}금리</td><td>${pct(a.rate)}</td><td>${won(a.interest)}</td><td><b>${won(a.after)}</b></td></tr>
      ${r.max > a.rate ? `<tr><td>우대조건 모두 충족(최고금리)</td><td>${pct(b.rate)}</td><td>${won(b.interest)}</td><td><b>${won(b.after)}</b></td></tr>` : ''}</table></div>
      <p class="small muted">단리 단순 계산${r.kind==='save'?'(매달 같은 날 납입 가정)':''}. 고객에게 확정 금액처럼 말하지 말고 '예상'임을 함께 안내하세요.</p>`;
  } else if (r.kind === 'card') {
    const b = cardBenefit(p, pf.spend, {});
    h += `<div class="box ${b.ok?'ok':'warn'}"><b>${esc(b.text)}</b>${b.monthly != null || b.yearly != null ? ` · 연 약 ${won(b.yearly ?? b.monthly*12)}${r.fee ? `(연회비 ${won(r.fee)}~ 별도)` : ''}` : ''}<div class="small muted">${esc(b.note)}</div></div>`;
  } else if (r.taxCredit) {
    h += `<div class="box info">연 보험료 600만원까지 납입액의 16.5% 세액공제(최대 연 99만원, 공식 페이지 기준). 공제율은 소득에 따라 달라질 수 있습니다.</div>`;
  } else {
    h += '<div class="box info">예상 연금액·보장 금액은 홈페이지에 공개되지 않았습니다. 상품안내장·가입설계서로 확인해 안내하세요.</div>';
  }

  h += '<h3>3. 상담 화법</h3>' + scriptBlock(p, pf);

  const cs = crossSell(p, pf);
  h += '<h3>4. 함께 제안할 상품(교차판매)</h3>';
  h += cs.length ? '<div class="recs">' + cs.map(({x, why}) => `<div class="rec"><b>${ICON[x.category]} ${esc(x.name)}</b><span class="small muted">${esc(x.one_liner)}</span><div class="why">${icon('bulb','bi')}${esc(why.join(' · '))}</div><button class="btn ghost no-print" data-go="${x.id}" title="고객 정보는 그대로 두고 보고서 3종을 이 상품 기준으로 바꿉니다">이 상품으로 전환${icon('arrow')}</button></div>`).join('') + '</div>'
    : '<p class="muted">입력한 프로필에 맞는 추가 상품이 없습니다. 니즈를 더 확인해 보세요.</p>';
  h += '<p class="small muted">교차판매는 고객에게 실제로 도움이 될 때만 제안하고, 다른 상품 가입을 조건으로 걸면 안 됩니다(불공정영업 금지).</p>';

  const ck = checked[p.id] || {};
  h += '<h3>5. 금융소비자보호법 6대 판매원칙 점검표</h3><div class="principles">' +
    PRINCIPLES.map(([t, d], i) => `<label><input type="checkbox" data-ck="${i}" ${ck[i]?'checked':''}><span><b>${t}</b> — ${d}</span></label>`).join('') + '</div>';
  h += `<h3>6. 상담 메모</h3><textarea class="memo no-print" placeholder="상담 결과, 고객 반응, 후속 조치(예: 3일 후 재연락)를 적으세요">${esc(pf.memo)}</textarea><div class="memo-print">${esc(pf.memo) || ' '}</div>`;
  return h + sourceBlock(p);
}

/* ---------- 화면 조립 ---------- */
function renderList() {
  document.getElementById('filters').innerHTML = CATS.map(c => `<button class="chip ${c===filter?'on':''}" data-cat="${c}">${c === '전체' ? c : ICON[c] + ' ' + c.replace('(방카슈랑스)','')}</button>`).join('');
  document.getElementById('plist').innerHTML = P.filter(p => filter === '전체' || p.category === filter).map(p => {
    const r = R[p.id];
    const kv = r.kind === 'card' ? `연회비 ${r.feeS}` : r.kind === 'ins' ? p.insurer : `최고 연 ${pct(r.max)}`;
    return `<li><button class="pitem ${p.id===cur?'on':''}" data-id="${p.id}"><span class="nm">${ICON[p.category]} ${esc(p.name)}</span><span class="ol">${esc(p.one_liner)}</span><span class="kv">${esc(kv)}</span></button></li>`;
  }).join('');
}
function renderReports() {
  const p = byId[cur];
  const e = document.getElementById('rep-edu'), g = document.getElementById('rep-guide'), t = document.getElementById('rep-teller');
  e.innerHTML = renderEdu(p);
  g.innerHTML = renderGuide(p); runCalcs(g);
  t.innerHTML = renderTeller(p);
  document.title = `${p.name}  — IBK 상품 상담 가이드`;
}
function renderTellerOnly() {
  const t = document.getElementById('rep-teller');
  const focus = document.activeElement && document.activeElement.closest('#pform') ? document.activeElement.dataset.p || document.activeElement.dataset.need : null;
  t.innerHTML = renderTeller(byId[cur]);
  if (focus) { const el = t.querySelector(`[data-p="${focus}"],[data-need="${focus}"]`); if (el) { el.focus(); if (el.setSelectionRange && el.type === 'text') el.setSelectionRange(el.value.length, el.value.length); } }
}
function setTab(k) {
  tab = k;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  document.querySelectorAll('.report').forEach(a => a.classList.toggle('active', a.id === 'rep-' + k));
}
function select(id) { cur = id; renderList(); renderReports(); window.scrollTo({ top:0, behavior:'smooth' }); }

document.getElementById('checked').textContent = `상품정보 기준일 ${CATALOG.checked_at} · ${P.length}개 상품`;
document.addEventListener('click', ev => {
  const c = ev.target.closest('[data-cat]'); if (c) { filter = c.dataset.cat; renderList(); return; }
  const it = ev.target.closest('[data-id]'); if (it) { switched = null; select(it.dataset.id); return; }
  const tb = ev.target.closest('.tab'); if (tb) { setTab(tb.dataset.k); return; }
  const go = ev.target.closest('[data-go]'); if (go) { switched = { from: cur }; select(go.dataset.go); setTab('teller'); return; }
  const back = ev.target.closest('[data-back]'); if (back) { const f = switched.from; switched = null; select(f); setTab('teller'); return; }
  const ps = ev.target.closest('[data-preset]');
  if (ps) { Object.assign(profile, PRESETS.find(s => s.key === ps.dataset.preset).v, { preset: ps.dataset.preset }); renderTellerOnly(); return; }
});
document.getElementById('print-one').onclick = () => { document.body.classList.remove('print-all'); window.print(); };
document.getElementById('print-all').onclick = () => {
  document.body.classList.add('print-all');
  document.querySelectorAll('details.flash').forEach(d => d.open = true);
  window.print();
  setTimeout(() => document.body.classList.remove('print-all'), 500);
};
window.addEventListener('beforeprint', () => document.querySelectorAll('details.flash').forEach(d => d.open = true));
document.getElementById('rep-guide').addEventListener('input', ev => { if (ev.target.closest('.calc')) runCalcs(document.getElementById('rep-guide')); });
const tellerEl = document.getElementById('rep-teller');
tellerEl.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.ck != null) { (checked[cur] ||= {})[el.dataset.ck] = el.checked; return; }
  if (el.dataset.need) { profile.needs = [...tellerEl.querySelectorAll('[data-need]:checked')].map(x => x.dataset.need); renderTellerOnly(); return; }
  if (el.dataset.p) {
    const k = el.dataset.p;
    profile[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' || k === 'term' ? Number(el.value) || 0 : el.value;
    renderTellerOnly();
  }
});
tellerEl.addEventListener('input', ev => {
  if (ev.target.classList.contains('memo')) { profile.memo = ev.target.value; tellerEl.querySelector('.memo-print').textContent = profile.memo; }
});

document.querySelectorAll('[data-icon]').forEach(e => e.outerHTML = icon(e.dataset.icon));
renderList();
renderReports();
</script>
